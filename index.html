<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Random Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="image-container">
        <div class="image-card">
            <img
                src="https://cdn.pixabay.com/photo/2026/08/16/16/13/16-13-34-594_1280.jpg"
                alt="Mountain landscape"
                loading="lazy">
            <a class="download-btn"
               href="https://cdn.pixabay.com/photo/2026/08/16/16/13/16-13-34-594_1280.jpg"
               download="gallery-image-1.jpg">Download</a>
        </div>

        <div class="image-card">
            <img
                src="https://cdn.pixabay.com/photo/2017/02/14/03/03/ama-dablam-2064522_1280.jpg"
                alt="Ama Dablam mountain"
                loading="lazy">
            <a class="download-btn"
               href="https://cdn.pixabay.com/photo/2017/02/14/03/03/ama-dablam-2064522_1280.jpg"
               download="gallery-image-2.jpg">Download</a>
        </div>

        <div class="image-card">
            <img
                src="https://cdn.pixabay.com/photo/2026/08/16/06/30/06-30-32-754_1280.jpg"
                alt="Nature landscape"
                loading="lazy">
            <a class="download-btn"
               href="https://cdn.pixabay.com/photo/2026/08/16/06/30/06-30-32-754_1280.jpg"
               download="gallery-image-3.jpg">Download</a>
        </div>

        <div class="image-card">
            <img
                src="https://images.unsplash.com/photo-1608613601650-b729a9895395?q=80&w=387&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                alt="Scenic view"
                loading="lazy">
            <a class="download-btn"
               href="https://images.unsplash.com/photo-1608613601650-b729a9895395?q=80&w=387&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
               download="gallery-image-4.jpg">Download</a>
        </div>

        <div class="image-card">
            <img
                src="https://images.unsplash.com/photo-1608613604000-ea53e2acc2ff?q=80&w=387&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                alt="Scenic view"
                loading="lazy">
            <a class="download-btn"
               href="https://images.unsplash.com/photo-1608613604000-ea53e2acc2ff?q=80&w=387&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
               download="gallery-image-5.jpg">Download</a>
        </div>
    </div>

    <button class="btn" type="button">Load More</button>

    <script src="script.js"></script>
</body>
</html>
